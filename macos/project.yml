# XcodeGen spec for Aircon, the menu bar app for the homebridge-ezone plugin's Mac app address.
# Generate the project with `xcodegen generate` (or run ./build.sh); the .xcodeproj itself is not committed.
name: Aircon
options:
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
targets:
  Aircon:
    type: application
    platform: macOS
    sources:
      - App
    settings:
      base:
        PRODUCT_NAME: Aircon
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Aircon
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Aircon.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
  AirconTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Aircon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).AirconTests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Aircon.app/Contents/MacOS/Aircon
schemes:
  Aircon:
    build:
      targets:
        Aircon: all
        AirconTests: [test]
    test:
      targets:
        - AirconTests
